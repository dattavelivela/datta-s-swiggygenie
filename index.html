function getAllDishes() {
  return restaurants.reduce(function (acc, restaurant) {
    return acc.concat(
      restaurant.dishes.map(function (dish) {
        return Object.assign({}, dish, { restaurant: restaurant.name });
      })
    );
  }, []);
}

function validateSetup(data) {
  return {
    hasPlan: Boolean(data.plan),
    hasDays: Array.isArray(data.selectedDates) && data.selectedDates.length > 0,
    hasSevenDishes: data.dishes.length === 7,
    hasValidTime: Boolean(data.time),
    hasCouponMode: data.couponMode === "auto-best",
    hasPaymentMode: data.paymentMode === "mandate" || data.paymentMode === "manual-upi",
    hasMandateMethod: data.paymentMode !== "mandate" || Boolean(data.paymentMethod),
    hasUpiId: data.paymentMode !== "manual-upi" || Boolean(data.upiId)
  };
}

function canAddDish(currentDishes, dishId) {
  var alreadyAdded = currentDishes.some(function (dish) {
    return dish.id === dishId;
  });
  return alreadyAdded || currentDishes.length < 7;
}

function runSmokeTests() {
  var sample = {
    plan: "Lunch",
    selectedDates: ["2026-05-01", "2026-05-02", "2026-05-03", "2026-05-04", "2026-05-05", "2026-05-06", "2026-05-07"],
    dishes: getAllDishes().slice(0, 7),
    couponMode: "auto-best",
    paymentMode: "mandate",
    paymentMethod: "Google Pay",
    upiId: "",
    mandateLimit: 1633,
    time: "1:00 PM"
  };

  var result = validateSetup(sample);
  console.assert(result.hasPlan, "Plan should be selected.");
  console.assert(result.hasDays, "At least one ordering date should be selected.");
  console.assert(result.hasSevenDishes, "Exactly 7 dishes should be selected.");
  console.assert(result.hasValidTime, "Delivery time should be selected.");
  console.assert(result.hasCouponMode, "Best available coupon should be auto-applied.");
  console.assert(result.hasPaymentMode, "Payment mode should be selected.");
  console.assert(result.hasMandateMethod, "Mandate payment method should be selected.");
  console.assert(sample.mandateLimit === 1633, "Mandate limit should be ₹1,633.");

  console.assert(getAllDishes().length >= 7, "There should be at least 7 selectable dishes.");
  console.assert(canAddDish(sample.dishes, sample.dishes[0].id), "Already selected dishes should be removable even after 7 selections.");
  console.assert(!canAddDish(sample.dishes, "new-dish"), "New dishes should not be added after 7 selections.");
}

  function toggleDate(date) {
    var selected = props.data.selectedDates || [];
    var exists = selected.indexOf(date) >= 0;
    var updated = exists
      ? selected.filter(function (item) { return item !== date; })
      : selected.concat(date);

    props.setData(Object.assign({}, props.data, {

      days: updated.length

  }

    var weekdays = calendarDays

function StepRestaurants(props) {
  var queryState = useState("");
  var query = queryState[0];
  var setQuery = queryState[1];

  var selectedRestaurantState = useState(null);
  var selectedRestaurantId = selectedRestaurantState[0];
  var setSelectedRestaurantId = selectedRestaurantState[1];

  var filteredRestaurants = useMemo(
    function () {
      var q = query.trim().toLowerCase();
      if (!q) return restaurants;
      return restaurants.filter(function (restaurant) {
        var restaurantMatch = restaurant.name.toLowerCase().includes(q) || restaurant.meta.toLowerCase().includes(q);
        var dishMatch = restaurant.dishes.some(function (dish) {
          return dish.name.toLowerCase().includes(q);
        });
        return restaurantMatch || dishMatch;
      });
    },
    [query]
  );

  var selectedRestaurant = restaurants.find(function (restaurant) {
    return restaurant.id === selectedRestaurantId;
  });

  function toggleDish(dish, restaurant) {
    var exists = props.data.dishes.some(function (item) {
      return item.id === dish.id;
    });

    var updated = props.data.dishes.slice();

    if (exists) {
      updated = updated.filter(function (item) {
        return item.id !== dish.id;
      });
    } else if (updated.length < 7) {
      updated.push(Object.assign({}, dish, { restaurant: restaurant.name }));
    }

    props.setData(Object.assign({}, props.data, { dishes: updated }));
  }

  return (
    <div style={mergeStyles(styles.content, { height: 644, boxSizing: "border-box", display: "flex", flexDirection: "column" })}>
      <ScreenTitle
        kicker="Rotation"
        title="Pick 7 go-to meals"
        subtitle="Choose meals once. Swiggy rotates them across your selected days and reshuffles the order weekly."
      />

      <div style={{ marginTop: 16, paddingBottom: 12 }}>
        <input
          value={query}
          onChange={function (event) {
            setQuery(event.target.value);
          }}
          placeholder="Search for restaurants or dishes you love"
          style={styles.input}
        />
        <div style={{ marginTop: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <p style={{ margin: 0, fontSize: 14, fontWeight: 800, color: "#18181b" }}>{props.data.dishes.length}/7 meals locked in</p>
          {props.data.dishes.length === 7 ? (
            <span style={mergeStyles(styles.pill, { background: "#dcfce7", color: "#15803d" })}>Ready</span>
          ) : (
            <span style={mergeStyles(styles.pill, { background: "#fff7ed", color: "#ea580c" })}>{7 - props.data.dishes.length} left</span>
          )}
        </div>
      </div>

      {!selectedRestaurant ? (

export default function SetupFlowUI() {
  var screenState = useState("setup");
  var screen = screenState[0];
  var setScreen = screenState[1];

  var stepState = useState(0);
  var step = stepState[0];
  var setStep = stepState[1];

  var dataState = useState({
    plan: "",
    days: 0,
    selectedDates: [],
    dishes: [],
    couponMode: "auto-best",
    paymentMode: "mandate",
    paymentMethod: "Google Pay",
    upiId: "",
    mandateLimit: 1633,
    time: "1:00 PM"
  });
  var data = dataState[0];
  var setData = dataState[1];

  function next() {
    setStep(function (currentStep) {
      return Math.min(currentStep + 1, steps.length - 1);
    });
  }

  function prev() {
    setStep(function (currentStep) {
      return Math.max(currentStep - 1, 0);
    });
  }

  if (screen === "mandate") {
    return (
      <div style={styles.page}>
        <PhoneFrame>
          <MandateApprovalScreen
            data={data}
            onBack={function () { setScreen("setup"); }}
            onAccept={function () { setScreen("success"); }}
          />
        </PhoneFrame>
      </div>
    );
  }

  if (screen === "success") {
    return (
      <div style={styles.page}>
        <PhoneFrame>
          <AutopilotSuccessScreen onDone={function () { setScreen("setup"); }} />
        </PhoneFrame>
      </div>
    );
  }

  return (
    <div style={styles.page}>
      <PhoneFrame>
        <ProgressBar step={step} />
        {step === 0 ? <StepPlanType next={next} data={data} setData={setData} /> : null}
        {step === 1 ? <StepDays next={next} prev={prev} data={data} setData={setData} /> : null}
        {step === 2 ? <StepRestaurants next={next} prev={prev} data={data} setData={setData} /> : null}
        {step === 3 ? <StepPreferences next={next} prev={prev} data={data} setData={setData} /> : null}
        {step === 4 ? <StepReview prev={prev} data={data} onStartMandate={function () { setScreen("mandate"); }} /> : null}
      </PhoneFrame>
    </div>
  );
}
